<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de notificações</title>
    <link rel="icon" type="image/png" href="./img/headset-barracred.png">
    <script src="index.js" defer></script>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172033; }
        main { width: min(520px, calc(100% - 40px)); padding: 32px; background: #fff; border-radius: 16px; box-shadow: 0 12px 36px rgb(23 32 51 / 12%); }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p { line-height: 1.5; color: #4b5565; }
        .acoes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
        button { border: 0; border-radius: 8px; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer; background: #155eef; color: #fff; }
        button.secundario { background: #e8eefc; color: #1746a2; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        #status { margin: 20px 0 0; padding: 12px; border-radius: 8px; background: #f1f5f9; color: #334155; }
        #status.sucesso { background: #dcfce7; color: #166534; }
        #status.erro { background: #fee2e2; color: #991b1b; }
        code { font-family: Consolas, monospace; }
    </style>
</head>
<body>
    <main>
        <h1>Teste de notificação do navegador</h1>
        <p>Ative as notificações e depois simule a chegada de uma nova solicitação.</p>

        <div class="acoes">
            <button id="ativar-notificacoes">Ativar notificações</button>
            <button id="simular-notificacao" class="secundario" disabled>Simular nova solicitação</button>
        </div>

        <p id="status" role="status">Verificando suporte do navegador…</p>
        <p><small>Abra esta página por <code>http://localhost</code> (ou HTTPS). O navegador não permite notificações em um arquivo aberto diretamente.</small></p>
    </main>
</body>
</html>
